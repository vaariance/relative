[package]
name = "relative-publisher"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[workspace]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token"] }
cox = { path = "../../../packages/cox/programs/cox", features = ["no-entrypoint"] }
relative-epoch = { path = "../../../packages/cox-epoch/programs/epoch", default-features = false, features = ["no-entrypoint"] }
cox-epoch = { path = "../../../packages/cox-epoch", features = ["borsh"] }
cox-math = { path = "../../../packages/cox/crates/math" }
relative-methodology = { path = "../../../packages/cox-methodology/rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
ed25519-dalek = "2.2"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

yellowstone-grpc-client = "=16.0.0"
yellowstone-grpc-proto = { version = "=14.0.1", default-features = false, features = ["tonic"] }
pyth-lazer-client = "=26.5.0"
pyth-lazer-protocol = "=0.46.0"
futures-util = "0.3"
tonic = { version = "0.14", features = ["tls-native-roots"] }

solana-message = { version = "=5.1.0", features = ["wincode"] }

solana-address = { version = "=2.8.0", features = ["curve25519", "std"] }
solana-hash = "=4.7.0"
solana-instruction = "=4.0.0"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
