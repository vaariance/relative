[package]
name = "cox-epoch"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["lib"]

[features]
default = []
borsh = ["dep:borsh", "dep:anchor-lang"]
idl-build = ["borsh", "anchor-lang/idl-build"]

[dependencies]
borsh = { version = "=0.10.4", optional = true }
anchor-lang = { version = "=0.31.1", optional = true }

[workspace]
members = ["programs/epoch"]
resolver = "2"

[profile.release]
overflow-checks = true
