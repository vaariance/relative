[package]
name = "relative-epoch"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "relative_epoch"

[features]
default = ["custom-heap"]
custom-heap = []
devnet-collateral = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "cox-epoch/idl-build", "cox/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }
cox-epoch = { path = "../..", features = ["borsh"] }

cox = { path = "../../../cox/programs/cox", default-features = false, features = ["no-entrypoint"] }
